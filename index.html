:root{

.modebar b{color:#ffd166}.modebar button{padding:6px 10px;font-size:13px;box-shadow:none}
.chatlog{position:fixed;left:max(16px,env(safe-area-inset-left,0px));top:calc(env(safe-area-inset-top,0px) + 150px);width:min(260px,55%);display:grid;gap:4px;pointer-events:none}
.cm{background:rgba(30,25,15,.6);color:#fff;font-size:13px;font-weight:700;padding:4px 8px;border-radius:8px;transition:opacity 1s;overflow-wrap:anywhere}.cm b{color:#ffd166}.cm.mine b{color:#ff9f7a}.cm.old{opacity:.3}
.mapp{width:min(640px,calc(100% - 32px));top:calc(env(safe-area-inset-top,0px) + 70px)}

.hud .btns button{padding:8px 11px;font-size:14px}
[hidden]{display:none!important}
body{margin:0;font-size:14px}

<script>
if(!window.THREE){document.body.insertAdjacentHTML("beforeend",'<div class="err">Не удалось загрузить 3D. Обнови страницу.</div>')}
// ---------- утилиты ----------
function hash(s){let h=2166136261;for(const c of s){h^=c.codePointAt(0);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){let a=seed||1;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const $=id=>document.getElementById(id);
const touch=matchMedia("(pointer:coarse)").matches;
const bp=$("buildPanel"),fp=$("findPanel"),nickIn=$("nick"),btn=$("btn"),msg=$("msg"),search=$("search"),hint=$("hint"),actBtn=$("act");
let toastT=null;function toast(t,ms=2600){const e=$("toast");e.textContent=t;e.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>e.hidden=true,ms)}
// личный улов и монеты (только в этом браузере)
let stats={fish:0,bag:0,cash:0,card:null,dep:null,rod:0,bait:0,eaten:0};try{Object.assign(stats,JSON.parse(localStorage.getItem("village_stats")||"{}"))}catch{}
if(stats.coins!=null){stats.cash+=stats.coins;delete stats.coins}
function saveStats(){try{localStorage.setItem("village_stats",JSON.stringify(stats))}catch{}
  $("stats").textContent=`Наличные ${stats.cash}`+(stats.card?` · Карта ${stats.card.balance}`:"")+(stats.fish?` · Рыба ${stats.fish}`:"")}
saveStats();
const settings={gfx:touch?1:2,sens:1,camD:7,labels:true,mini:true,walk:1};
try{Object.assign(settings,JSON.parse(localStorage.getItem("village_settings")||"{}"))}catch{}

// ---------- сцена ----------
const canvas=$("world");
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();
const SKY=0xf3c9a4;scene.background=new THREE.Color(SKY);scene.fog=new THREE.Fog(SKY,55,240);
const camera=new THREE.PerspectiveCamera(70,1,0.1,600);camera.rotation.order="YXZ";
scene.add(new THREE.HemisphereLight(0xfff0dc,0x50703c,0.85));
const sun=new THREE.DirectionalLight(0xffe0b8,0.75);sun.position.set(-60,80,40);scene.add(sun);
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
addEventListener("resize",resize);resize();

const mats={};
const M=(c,em)=>{const k=c+"|"+(em||0);return mats[k]||(mats[k]=new THREE.MeshLambertMaterial({color:c,emissive:em?c:0x000000,emissiveIntensity:em||0}))};
function plane(w,d,c,x,z,y=.02){const m=new THREE.Mesh(new THREE.PlaneGeometry(w,d),M(c));m.rotation.x=-Math.PI/2;m.position.set(x,y,z);scene.add(m);return m}
function box(g,w,h,d,c,x,y,z,em){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),M(c,em));m.position.set(x,y,z);g.add(m);return m}
function cyl(g,rt,rb,h,c,x,y,z,seg=12){const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg),M(c));m.position.set(x,y,z);g.add(m);return m}
plane(2000,2000,0x6fa552,0,0,0);
plane(4.5,1260,0xc9a46c,0,-530);
plane(70,86,0xdccdaa,5,57,.01); // площадь

// деревья (инстансы)
const MAXT=1600;
const trunkI=new THREE.InstancedMesh(new THREE.CylinderGeometry(.18,.25,1.6,6),M(0x6b4a2e),MAXT);
const coneI=new THREE.InstancedMesh(new THREE.ConeGeometry(1.5,4,7),M(0x2f5e3a),MAXT);
const ballI=new THREE.InstancedMesh(new THREE.IcosahedronGeometry(1.6,0),M(0x7aa23e),MAXT);
[trunkI,coneI,ballI].forEach(m=>scene.add(m));
const treeCand=(()=>{const r=rng(777),a=[];for(let i=0;i<5200;i++)a.push({x:(r()*2-1)*170,z:125-r()*500,s:.7+r()*.8,cone:r()<.55});return a})();

// ---------- коллизии ----------
const statics=[]; // {x,z,hx,hz} или {x,z,r}
let colliders=[];
const LAKE={x:-50,z:72,r:15}, PIER={x0:-45,x1:-33,z:72,hw:1.2};
function onPier(x,z){return x>PIER.x0&&x<PIER.x1+2&&Math.abs(z-PIER.z)<PIER.hw}
function valid(x,z){
  const R=.4;
  if(Math.hypot(x-LAKE.x,z-LAKE.z)<LAKE.r+.2&&!onPier(x,z))return false;
  for(const c of statics.concat(colliders)){
    if(c.r!==undefined){if(Math.hypot(x-c.x,z-c.z)<c.r+R)return false}
    else if(Math.abs(x-c.x)<c.hx+R&&Math.abs(z-c.z)<c.hz+R)return false}
  return true;
}

// ---------- таблички ----------
function label(text,emoji,me){
  const c=document.createElement("canvas");c.width=512;c.height=150;const x=c.getContext("2d");
  x.font="72px system-ui,'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif";x.textAlign="center";x.textBaseline="middle";x.fillText(emoji,256,40);
  x.font="800 40px Nunito,system-ui,sans-serif";let t=text;while(x.measureText(t).width>440&&t.length>2)t=t.slice(0,-2);if(t!==text)t+="…";
  const tw=x.measureText(t).width+44;x.fillStyle=me?"#e2683c":"rgba(255,250,242,.95)";x.beginPath();
  const bx=256-tw/2,by=86,bh=56,r=16;x.moveTo(bx+r,by);x.arcTo(bx+tw,by,bx+tw,by+bh,r);x.arcTo(bx+tw,by+bh,bx,by+bh,r);x.arcTo(bx,by+bh,bx,by,r);x.arcTo(bx,by,bx+tw,by,r);x.fill();
  x.fillStyle=me?"#fff":"#2b2a22";x.fillText(t,256,by+bh/2+2);
  const tex=new THREE.CanvasTexture(c);tex.anisotropy=4;
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,depthWrite:false}));sp.scale.set(6,1.76,1);sp.userData.lbl=true;sp.visible=settings.labels;return sp;
}

// ---------- места: площадь, магазины, развлечения, озеро ----------
const places=[]; // {name,x,z,r,act(),label}
function building({x,z,side,w,d,h,wall,roof,aw1,aw2,name,emoji,neon}){
  const g=new THREE.Group();
  box(g,w,h,d,wall,0,h/2,0);box(g,w+.4,.3,d+.4,roof,0,h+.15,0);
  box(g,1.6,2.4,.15,0x3d2b1f,0,1.2,d/2+.08);
  box(g,w*.28,1.4,.12,0xcdeffd,-w*.3,1.9,d/2+.06,.25);box(g,w*.28,1.4,.12,0xcdeffd,w*.3,1.9,d/2+.06,.25);
  if(aw1){const n=8;for(let i=0;i<n;i++){const s=box(g,w/n,.12,1.6,i%2?aw1:aw2,-w/2+(i+.5)*w/n,h-.6,d/2+.75);s.rotation.x=.35}}
  if(neon){box(g,w*.9,.18,.1,neon,0,h-.4,d/2+.06,.9);box(g,w*.9,.18,.1,0x00f5d4,0,h-.8,d/2+.06,.9)}
  const lb=label(name,emoji);lb.position.y=h+2;g.add(lb);
  g.position.set(x,0,z);g.rotation.y=side<0?Math.PI/2:-Math.PI/2;scene.add(g);
  statics.push({x,z,hx:d/2+.2,hz:w/2+.2});

const mapP=$("mapPanel"),bigC=$("bigmap");let mapView=null;
function openMap(){closePanels();home.hidden=true;started=true;mapP.hidden=false;
  const W=Math.max(200,Math.min(mapP.clientWidth-32,600)),H=Math.max(200,Math.min(innerHeight*.58,560));bigC.width=W*2;bigC.height=H*2;bigC.style.width=W+"px";bigC.style.height=H+"px";
  const rows=Math.ceil((houses.length+1)/PER_ROW),zEnd=-10-rows*19-8;mapView={W,H,sc:Math.min(W/150,H/(116-zEnd)),cx:0,cz:(116+zEnd)/2};drawBig()}
function drawBig(){if(mapP.hidden||!mapView)return;const c=bigC.getContext("2d");c.setTransform(2,0,0,2,0,0);drawMap(c,mapView.W,mapView.H,mapView.cx,mapView.cz,mapView.sc,true)}
bigC.addEventListener("click",e=>{const r=bigC.getBoundingClientRect(),v=mapView;if(!v)return;const x=v.cx+(e.clientX-r.left-v.W/2)/v.sc,z=v.cz+(e.clientY-r.top-v.H/2)/v.sc;
  if(!valid(x,z)||Math.abs(x)>160||z>116){toast("Туда нельзя, выбери свободное место");return}goTo({x,z,lx:x,lz:z-1});mapP.hidden=true});
$("mapClose").onclick=()=>mapP.hidden=true;

// ---------- режимы ----------
let mode=null;const modeObjs=new THREE.Group();scene.add(modeObjs);
const RACE=[[0,82],[-24,64],[-26,30],[-6,16],[0,-20],[0,-55],[8,10],[28,40],[10,95]];
const MODES=[
  {id:"free",name:"Свободная прогулка",desc:"Гуляй, рыбачь, катайся, без таймера"},
  {id:"coins",name:"Охота за монетами",desc:"2 минуты, собери как можно больше золотых монет. Всё собранное твоё"},
  {id:"fish",name:"Рыболовный турнир",desc:"3 минуты на пирсе. В конце бонус 50% от стоимости улова"},
  {id:"race",name:"Гонка по кольцам",desc:"Пробеги 9 колец как можно быстрее. Новый рекорд даёт 20 монет"}];
let best={};try{best=JSON.parse(localStorage.getItem("village_best")||"{}")}catch{}
function saveBest(){try{localStorage.setItem("village_best",JSON.stringify(best))}catch{}}
function clearModeObjs(){modeObjs.children.slice().forEach(c=>{modeObjs.remove(c);if(c.geometry)c.geometry.dispose()})}
function startMode(id){endMode(true);hideHome();if(id==="free"){toast("Свободная прогулка");return}
  mode={id,t:0,score:0};
  if(id==="coins"){mode.left=120;mode.coins=[];const r=rng(Date.now()%1e9),rows=Math.ceil(houses.length/PER_ROW);let tries=0;
    while(mode.coins.length<25&&tries<3000){tries++;const x=(r()*2-1)*40,z=105-r()*(115+rows*19);if(!valid(x,z))continue;
      const m=new THREE.Mesh(new THREE.CylinderGeometry(.6,.6,.15,16),M(0xffd60a,.35));m.rotation.x=Math.PI/2;m.position.set(x,1.1,z);modeObjs.add(m);mode.coins.push({x,z,m,got:false})}
    mode.total=mode.coins.length;toast("Собирай монеты! Жёлтые точки на карте",2500)}
  if(id==="fish"){mode.left=180;goTo({x:PIER.x0+1.2,z:PIER.z,lx:PIER.x0-3,lz:PIER.z});toast("Турнир начался! Закидывай удочку",2500)}
  if(id==="race"){mode.i=0;mode.rings=RACE.map(([x,z])=>{const m=new THREE.Mesh(new THREE.TorusGeometry(2.2,.25,8,24),M(0xff006e,.5));m.position.set(x,2.4,z);modeObjs.add(m);return m});
    goTo({x:0,z:96,lx:0,lz:82});toast("Беги к розовому кольцу!",2500)}
  updateModeBar()}
function endMode(silent){if(!mode)return;const m=mode;mode=null;clearModeObjs();$("modebar").hidden=true;if(silent)return;let t="";
  if(m.id==="coins"){stats.cash+=m.score;const b=best.coins||0;if(m.score>b)best.coins=m.score;t=`Время вышло! Собрано ${m.score} монет`+(m.score>b?", новый рекорд!":"")}
  if(m.id==="fish"){const bonus=Math.round(m.score*.5);stats.cash+=bonus;const b=best.fish||0;if(m.score>b)best.fish=m.score;t=`Турнир окончен! Улов на ${m.score} монет, бонус +${bonus}`+(m.score>b?", рекорд!":"")}
  if(m.id==="race"){const sec=+m.t.toFixed(1),b=best.race,rec=!b||sec<b;if(rec){best.race=sec;stats.cash+=20}t=`Финиш за ${sec} с`+(rec?". Рекорд! +20 монет":`. Рекорд: ${b} с`)}
  saveStats();saveBest();toast(t,4500)}
const fmt=s=>{s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};
function updateModeBar(){if(!mode){$("modebar").hidden=true;return}$("modebar").hidden=false;$("mbName").textContent=MODES.find(x=>x.id===mode.id).name;
  $("mbInfo").textContent=mode.id==="coins"?`${mode.score}/${mode.total} · ${fmt(mode.left)}`:mode.id==="fish"?`улов ${mode.score} · ${fmt(mode.left)}`:`кольцо ${Math.min(mode.i+1,RACE.length)}/${RACE.length} · ${mode.t.toFixed(1)} с`}
function modeTick(dt,time){if(!mode)return;mode.t+=dt;
  if(mode.id==="coins"){mode.left-=dt;mode.coins.forEach(c=>{if(c.got)return;c.m.rotation.z=time*2;c.m.position.y=1.1+Math.sin(time*3+c.x)*.2;
      if(Math.hypot(pos.x-c.x,pos.z-c.z)<1.6){c.got=true;c.m.visible=false;mode.score++}});if(mode.score>=mode.total||mode.left<=0){endMode();return}}
  if(mode.id==="fish"){mode.left-=dt;if(mode.left<=0){endMode();return}}
  if(mode.id==="race"){mode.rings.forEach((r,i)=>{r.visible=i>=mode.i;r.material=M(i===mode.i?0xff006e:0xffb3d1,i===mode.i?.6:.2);r.rotation.y=time});
    const p=RACE[mode.i];if(Math.hypot(pos.x-p[0],pos.z-p[1])<2.6){mode.i++;if(mode.i>=RACE.length){endMode();return}toast(`Кольцо ${mode.i}/${RACE.length}`,900)}}
  updateModeBar()}
$("mbQuit").onclick=()=>{endMode(true);toast("Режим остановлен")};

// ---------- главное меню ----------
const home=$("home");let started=false;hint.style.opacity="0";
function showHome(view){view=view||"main";closePanels();home.hidden=false;
  $("homeMain").hidden=view!=="main";$("homeModes").hidden=view!=="modes";$("homeSettings").hidden=view!=="settings";
  if(view==="modes")renderModes();if(view==="settings")renderSettings();$("play").textContent=started?"Продолжить":"Играть";updateOnline()}
function hideHome(){home.hidden=true;if(!started){started=true;hint.style.opacity="1"}}
$("play").onclick=hideHome;$("hModes").onclick=()=>showHome("modes");$("hSettings").onclick=()=>showHome("settings");$("hMap").onclick=()=>openMap();
$("hudMenu").onclick=()=>showHome("main");$("hudMap").onclick=()=>openMap();$("hudChat").onclick=()=>openChat();
["openBuild","openFind"].forEach(id=>$(id).addEventListener("click",()=>{home.hidden=true;started=true},true));
function backHead(title){const hd=el("div","mhead");hd.append(el("h2",null,title));const bk=el("button",null,"Назад");bk.type="button";bk.onclick=()=>showHome("main");hd.append(bk);return hd}
function renderModes(){const box=$("homeModes");box.innerHTML="";box.append(backHead("Режимы игры"));const list=el("div","items");
  MODES.forEach(m=>{const bs=m.id==="coins"&&best.coins?`Рекорд: ${best.coins} монет`:m.id==="fish"&&best.fish?`Рекорд: улов на ${best.fish}`:m.id==="race"&&best.race?`Рекорд: ${best.race} с`:"";
    const r=el("div","item"),d=el("div");d.append(el("b",null,m.name),el("small",null,m.desc+(bs?". "+bs:"")));const b=el("button","primary",mode&&mode.id===m.id?"Заново":"Начать");b.type="button";b.onclick=()=>startMode(m.id);r.append(d,b);list.append(r)});
  box.append(list)}
function seg(label,opts,key,after){const w=el("div");w.append(el("label",null,label));const r=el("div","pay");
  opts.forEach((t,i)=>{const b=el("button",settings[key]===i?"on":"",t);b.type="button";b.onclick=()=>{settings[key]=i;applySettings();if(after)after();renderSettings()};r.append(b)});w.append(r);return w}
function slider(label,key,min,max,step,f){const w=el("div"),l=el("label",null,`${label}: ${f(settings[key])}`),i=el("input");i.type="range";i.min=min;i.max=max;i.step=step;i.value=settings[key];i.id="s_"+key;l.htmlFor=i.id;
  i.oninput=()=>{settings[key]=+i.value;l.textContent=`${label}: ${f(settings[key])}`;applySettings()};w.append(l,i);return w}
function check(label,key){const w=el("label","chk"),i=el("input");i.type="checkbox";i.checked=!!settings[key];i.id="s_"+key;i.onchange=()=>{settings[key]=i.checked;applySettings()};w.append(i,el("span",null,label));return w}
function renderSettings(){const box=$("homeSettings");box.innerHTML="";
  box.append(backHead("Настройки"),seg("Графика",["Низкая","Средняя","Высокая"],"gfx",rebuild),seg("Скорость ходьбы",["Медленно","Обычно","Быстро"],"walk"),
    slider("Чувствительность камеры","sens",.4,2,.1,v=>v.toFixed(1)),slider("Камера от 3-го лица","camD",3,14,1,v=>v+" м"),check("Ники над домами","labels"),check("Мини-карта","mini"),
    el("p","money","Если игра тормозит на телефоне, поставь графику «Низкая»."))}

// ---------- мультиплеер и чат ----------
let room=null;const others=new Map();
function myNick(){return(myDoc&&myDoc.nick)||"Гость"}
function makeAvatar(nick){const g=new THREE.Group(),lm={};buildPerson(g,lm,nick);const lb=label(nick,"🙂");lb.scale.set(4,1.17,1);lb.position.y=3;g.add(lb);scene.add(g);return{g,lm,ph:0}}
function updateOnline(){const n=1+others.size;$("online").textContent=n>1?`В игре: ${n}`:"В игре: только ты";$("homeOnline").textContent=`Жителей: ${houses.length} · Сейчас в игре: ${n}`}
function syncPeers(list){const seen=new Set();
  for(const p of list){if(p.isMe||p.kind!=="viewer")continue;const pr=p.presence||{};if(typeof pr.x!=="number"||typeof pr.z!=="number")continue;seen.add(p.peer);
    const nick=typeof pr.n==="string"&&pr.n?pr.n.slice(0,20):"Гость";let o=others.get(p.peer);
    if(!o||o.nick!==nick){const cur=o?o.cur:{x:pr.x,z:pr.z,y:+pr.y||0,h:+pr.h||0};if(o){scene.remove(o.g);disposeGroup(o.g)}o=Object.assign(makeAvatar(nick),{nick,cur});others.set(p.peer,o)}
    o.tg={x:pr.x,z:pr.z,y:+pr.y||0,h:+pr.h||0,mv:!!pr.mv}}
  for(const[k,o]of others)if(!seen.has(k)){scene.remove(o.g);disposeGroup(o.g);others.delete(k)}
  updateOnline()}
let lastPres=0,lastSig="";
function sendPresence(now,speed){if(!playerRef||now-lastPres<150)return;lastPres=now;
  const p={x:+pos.x.toFixed(2),z:+pos.z.toFixed(2),y:+pos.y.toFixed(2),h:+heading.toFixed(2),mv:speed>0?1:0,n:myNick()};const sg=JSON.stringify(p);if(sg===lastSig)return;lastSig=sg;playerRef.set(p).catch(()=>{})}
function tickOthers(dt){const k=Math.min(1,dt*10);others.forEach(o=>{if(!o.tg)return;const c=o.cur,t=o.tg;c.x+=(t.x-c.x)*k;c.z+=(t.z-c.z)*k;c.y+=(t.y-c.y)*k;c.h+=Math.atan2(Math.sin(t.h-c.h),Math.cos(t.h-c.h))*k;
  o.g.position.set(c.x,c.y,c.z);o.g.rotation.y=c.h;if(t.mv)o.ph+=dt*9;else o.ph*=.85;const sw=Math.sin(o.ph)*(t.mv?.7:0);o.lm.lL.rotation.x=sw;o.lm.lR.rotation.x=-sw;o.lm.aL.rotation.x=-sw*.8;o.lm.aR.rotation.x=sw*.8})}
const chatP=$("chatPanel"),chatLog=$("chatlog");
function openChat(){closePanels();chatP.hidden=false;$("chatIn").focus();$("chatMsg").textContent=rdb?"Сообщение увидят все, кто сейчас в деревне":"Чат пока не подключён к базе"}
function addChat(n,t,mine){const d=el("div","cm"+(mine?" mine":""));d.append(el("b",null,n+": "),document.createTextNode(t));chatLog.append(d);while(chatLog.children.length>6)chatLog.firstChild.remove();setTimeout(()=>d.classList.add("old"),15000)}
let rdb=null,playerRef=null;
chatP.addEventListener("submit",async e=>{e.preventDefault();const t=$("chatIn").value.trim().slice(0,120);if(!t)return;if(!rdb||!myId){$("chatMsg").textContent="Чат пока не подключён";return}
  try{await rdb.ref("chat").push({t,n:myNick(),uid:myId,ts:firebase.database.ServerValue.TIMESTAMP});$("chatIn").value="";$("chatMsg").textContent="Отправлено"}catch(err){$("chatMsg").textContent="Не отправилось, попробуй ещё"}});
function firebaseReady(){return window.firebase&&firebaseConfig.apiKey&&!firebaseConfig.apiKey.includes("ВСТАВЬ")}

applySettings();
rebuild();
frame();
placeHud();setTimeout(placeHud,800);

let pendingGo=false,canWrite=null,dbHouses=[];
let localHouse=null;try{localHouse=JSON.parse(localStorage.getItem("village_myhouse")||"null")}catch{}
function refreshHouses(){
  const mine=dbHouses.find(h=>h.id===myId);
  const loc=!mine&&localHouse&&localHouse.nick&&!dbHouses.some(h=>h.nick.toLowerCase()===localHouse.nick.toLowerCase())?[{id:"local",nick:localHouse.nick,at:Infinity,local:true}]:[];
  houses=dbHouses.concat(loc);myDoc=mine||loc[0]||null;
  if(myDoc){$("openBuild").textContent="Сменить ник";if(!nickIn.value)nickIn.value=myDoc.nick;btn.textContent="Сменить";dressHero(myDoc.nick)}
  rebuild();updateOnline();if(myDoc&&pendingGo){pendingGo=false;goTo(myDoc)}}
function buildLocal(nick,why){localHouse={nick};try{localStorage.setItem("village_myhouse",JSON.stringify(localHouse))}catch{}
  msg.textContent=why;pendingGo=true;refreshHouses()}
bp.addEventListener("submit",async e=>{e.preventDefault();const nick=nickIn.value.trim().replace(/\s+/g," ").slice(0,20);
  if(!nick){msg.textContent="Впиши ник";return}
  if(dbHouses.some(h=>h.id!==myId&&h.nick.toLowerCase()===nick.toLowerCase())){msg.textContent="Такой ник уже занят, придумай другой";return}
  if(!rdb||!myId||canWrite===false){buildLocal(nick,"Дом построен, но пока только у тебя: нет связи с сервером.");return}
  btn.disabled=true;msg.textContent="Строим…";
  try{await rdb.ref("houses/"+myId).set({nick,at:(myDoc&&!myDoc.local&&myDoc.at)||Date.now()});
    localHouse=null;try{localStorage.removeItem("village_myhouse")}catch{}
    msg.textContent="Готово! Твой дом видят все. Идём к нему.";pendingGo=true;const h=dbHouses.find(x=>x.id===myId);if(h&&h.nick===nick){pendingGo=false;goTo(h)}}
  catch(err){if(err&&/PERMISSION/i.test(err.code||err.message||"")){canWrite=false;buildLocal(nick,"Сервер не дал сохранить дом. Проверь правила базы в Firebase.")}else msg.textContent="Не получилось сохранить, попробуй ещё раз."}
  finally{btn.disabled=false}});
refreshHouses();

if(firebaseReady()){
  try{firebase.initializeApp(firebaseConfig);rdb=firebase.database();
    firebase.auth().signInAnonymously().catch(e=>toast("Не удалось подключиться: "+e.code,5000));
    firebase.auth().onAuthStateChanged(u=>{if(!u)return;myId=u.uid;canWrite=true;db=true;
      playerRef=rdb.ref("players/"+myId);playerRef.onDisconnect().remove();
      rdb.ref("houses").on("value",snap=>{const v=snap.val()||{};
        dbHouses=Object.entries(v).map(([id,h])=>({id,nick:h&&h.nick,at:+(h&&h.at)||0})).filter(h=>typeof h.nick==="string"&&h.nick).sort((x,y)=>x.at-y.at);refreshHouses()});
      rdb.ref("players").on("value",snap=>{const v=snap.val()||{};syncPeers(Object.entries(v).map(([k,p])=>({peer:k,isMe:k===myId,kind:"viewer",presence:p||{}})))});
      rdb.ref("chat").limitToLast(20).on("child_added",snap=>{const d=snap.val()||{};if(typeof d.t!=="string"||!d.t)return;addChat(typeof d.n==="string"&&d.n?d.n.slice(0,20):"Гость",d.t.slice(0,120),d.uid===myId)});
    });
  }catch(e){toast("Ошибка настроек Firebase, проверь блок firebaseConfig",6000)}
}else{setTimeout(()=>toast("Сайт ещё не подключён к базе: вставь настройки Firebase",6000),1500)}
</script>
</body>
</html>
